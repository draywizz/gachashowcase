<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVODL level cards</title>
<style>
  :root {
    --bg: #10131f;
    --line: #2a3050;
    --text: #e9ecf5;
    --muted: #8d95b3;
    --focus: #f5b301;
    --rarity: #a855f7; /* overwritten per card from JS */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 "Avenir Next", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  }

  .page {
    display: grid;
    grid-template-columns: auto minmax(280px, 420px);
    gap: 64px;
    align-items: center;
    width: 100%;
    max-width: 880px;
  }

  /* ---------- card ---------- */

  .viewer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .stage {
    width: 310px;
    height: 440px;
    display: grid;
    place-items: center;
    perspective: 1100px;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .stage.dragging { cursor: grabbing; }

  .card {
    position: relative;
    width: 260px;
    height: 372px;
    transform-style: preserve-3d;
    will-change: transform;
  }

  .face {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    overflow: hidden;
    isolation: isolate;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border: 3px solid var(--rarity);
    box-shadow: 0 18px 36px rgba(0, 0, 0, .5);
  }

  .front {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #1b2032;
  }

  .back {
    transform: rotateY(180deg);
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 46%, #1b4fa8 0%, #0c2257 45%, #050a1c 85%);
    border-color: #2f7bff;
  }
  .back::after {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(111, 178, 255, .35);
    border-radius: 8px;
    pointer-events: none;
  }
  .logo { width: 78%; height: auto; filter: drop-shadow(0 0 14px rgba(58, 160, 255, .55)); }
  .wordmark { font-size: 40px; font-weight: 800; letter-spacing: .02em; color: #dcebff; }

  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-rank { font-size: 24px; font-weight: 800; }

  .chip {
    padding: 2px 8px;
    border: 1px solid var(--rarity);
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: color-mix(in srgb, var(--rarity) 30%, #000);
  }

  .art {
    position: relative;
    flex: 1;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 8px;
    text-align: center;
  }
  .art img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .art b {
    position: relative;
    padding: 10px;
    font-size: 32px;
    line-height: 1;
    font-weight: 900;
    text-shadow: 0 2px 10px rgba(0, 0, 0, .8);
  }
  .card img { -webkit-user-drag: none; user-select: none; pointer-events: none; }

  .card-name { font-size: 17px; font-weight: 800; line-height: 1.15; }
  .card-meta { margin-top: -6px; font-size: 12px; color: var(--muted); }

  /* holographic foil layers, driven by --bx/--by/--gx/--gy/--hi from the loop */
  .foil, .glare { position: absolute; inset: 0; pointer-events: none; }
  .foil {
    background: repeating-linear-gradient(115deg, #ff2d95 0%, #ffd32d 10%, #2dff8f 20%, #2dc4ff 30%, #8f2dff 40%, #ff2d95 50%);
    background-size: 260% 260%;
    background-position: var(--bx) var(--by);
    mix-blend-mode: color-dodge;
    opacity: calc(var(--hi) * .6);
    filter: saturate(1.3);
  }
  .glare {
    background: radial-gradient(circle at var(--gx) var(--gy), rgba(255, 255, 255, .55), transparent 42%);
    mix-blend-mode: soft-light;
    opacity: var(--hi);
  }
  .card.flat .foil { display: none; }

  /* the #1 card gets a multicolour border instead of a flat one */
  .card.apex .front {
    border-color: transparent;
    background:
      linear-gradient(#1b2032, #1b2032) padding-box,
      linear-gradient(135deg, #2dc4ff, #8f2dff, #ff2d95, #ffd32d, #2dff8f) border-box;
  }

  /* ---------- controls ---------- */

  .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

  button, select, .btn {
    display: inline-block;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #1a1f33;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    text-decoration: none;
    cursor: pointer;
  }
  button:hover, select:hover, .btn:hover { border-color: #566087; }
  button:focus-visible, select:focus-visible, .btn:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  button[aria-pressed="true"] { border-color: var(--focus); color: var(--focus); }

  .hint { font-size: 13px; color: var(--muted); }

  /* ---------- details panel ---------- */

  .details select { margin-bottom: 18px; }

  .details h1 {
    margin: 0 0 10px;
    font-size: 28px;
    line-height: 1.15;
    font-weight: 800;
  }
  .details .chip { display: inline-block; margin-bottom: 18px; font-size: 13px; }

  .rows { margin: 0 0 18px; }
  .rows div {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 14px;
    padding: 7px 0;
    border-bottom: 1px solid var(--line);
  }
  .rows dt { color: var(--muted); }
  .rows dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }

  .desc { margin: 0 0 18px; max-width: 60ch; color: #c4c9dc; }

  @media (max-width: 760px) {
    .page { grid-template-columns: 1fr; gap: 32px; justify-items: center; }
    .details { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage { cursor: default; }
  }
</style>
</head>
<body>
<main class="page">

  <section class="viewer">
    <div class="stage" id="stage" aria-label="Level card. Drag to turn it.">
      <div class="card" id="card">
        <div class="face front">
          <div class="card-head">
            <span class="card-rank" id="cardRank"></span>
            <span class="chip" id="cardTier"></span>
          </div>
          <div class="art" id="cardArt"></div>
          <div class="card-name" id="cardName"></div>
          <div class="card-meta" id="cardVerifier"></div>
          <div class="card-meta" id="cardPublisher"></div>
          <div class="foil"></div>
          <div class="glare"></div>
        </div>
        <div class="face back" id="cardBack"></div>
      </div>
    </div>

    <div class="controls">
      <button type="button" id="flipBtn">Flip</button>
      <button type="button" id="resetBtn">Reset</button>
      <button type="button" id="spinBtn" aria-pressed="true">Auto-spin</button>
      <button type="button" id="foilBtn" aria-pressed="true">Foil</button>
    </div>
    <span class="hint">Drag the card to turn it.</span>
  </section>

  <section class="details">
    <select id="levelPick" aria-label="Choose a level"></select>
    <h1 id="title"></h1>
    <span class="chip" id="tierChip"></span>
    <dl class="rows" id="rows"></dl>
    <p class="desc" id="desc"></p>
    <a class="btn" id="video" target="_blank" rel="noopener noreferrer">Watch verification</a>
  </section>

</main>

<script>
/*
  Edit LEVELS to use your own list. Only rank and name are required.
  thumb: image URL or data URI for the art area (a generated cover is used when empty or broken).
  hue:   optional 0-360 for the generated cover colour.
*/

// Paste the two data URIs from your original file between the quotes.
const LOGO_SRC = "";
const TROPICAL_LIGHTS_THUMB = "";

const LEVELS = [
  {
    rank: 1, name: "Tropical Lights", id: "148605108", hue: 175,
    verifier: "iidust", publisher: "bandit08", creator: "bandit08",
    difficulty: "Insane Demon", requirement: "70%", original: "Antarctic Lights",
    completions: "3", enjoyment: "6.00/10",
    score: "1,000 pts at 100% (100 pts at 70%)",
    video: "https://youtu.be/USfDd-T2A0I",
    thumb: TROPICAL_LIGHTS_THUMB
  },
  // Placeholders so each tier can be previewed. Remove them once the real list is in.
  { rank: 7,   name: "Sample mythic",    verifier: "Verifier", publisher: "Publisher", id: "0", tags: "Sample", desc: "Placeholder entry for this tier." },
  { rank: 20,  name: "Sample legendary", verifier: "Verifier", publisher: "Publisher", id: "0", tags: "Sample", desc: "Placeholder entry for this tier." },
  { rank: 60,  name: "Sample epic",      verifier: "Verifier", publisher: "Publisher", id: "0", tags: "Sample", desc: "Placeholder entry for this tier." },
  { rank: 150, name: "Sample rare",      verifier: "Verifier", publisher: "Publisher", id: "0", tags: "Sample", desc: "Placeholder entry for this tier." },
  { rank: 400, name: "Sample uncommon",  verifier: "Verifier", publisher: "Publisher", id: "0", tags: "Sample", desc: "Placeholder entry for this tier." },
  { rank: 900, name: "Sample common",    verifier: "Verifier", publisher: "Publisher", id: "0", tags: "Sample", desc: "Placeholder entry for this tier." }
];

// [tier, last rank in it, label]
const TIERS = [
  ["apex",      1,        "Top 1"],
  ["mythic",    10,       "Top 10"],
  ["legendary", 35,       "Top 35"],
  ["epic",      100,      "Top 100"],
  ["rare",      260,      "Top 260"],
  ["uncommon",  640,      "Top 640"],
  ["common",    Infinity, "Below 640"]
];

const TIER_COLOR = {
  apex: "#8f2dff",
  mythic: "#ef4444",
  legendary: "#f5b301",
  epic: "#a855f7",
  rare: "#3b82f6",
  uncommon: "#3ecf6e",
  common: "#9aa0a6"
};

const tierFor = rank => TIERS.find(tier => rank <= tier[1]);
const capitalize = text => text.charAt(0).toUpperCase() + text.slice(1);
const byId = id => document.getElementById(id);

function escapeHtml(text) {
  const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" };
  return String(text).replace(/[&<>"]/g, ch => map[ch]);
}

const el = {
  card: byId("card"),
  stage: byId("stage"),
  art: byId("cardArt"),
  back: byId("cardBack"),
  rows: byId("rows"),
  video: byId("video"),
  desc: byId("desc"),
  pick: byId("levelPick"),
  spinBtn: byId("spinBtn"),
  foilBtn: byId("foilBtn")
};

/* ---------- rendering ---------- */

function renderBack() {
  el.back.innerHTML = LOGO_SRC
    ? '<img class="logo" draggable="false" alt="EVODL" src="' + escapeHtml(LOGO_SRC) + '">'
    : '<span class="wordmark">EVODL</span>';
}

// Same name always gives the same cover colour.
function coverHue(level) {
  if (level.hue !== undefined) return level.hue;
  const sum = [...level.name].reduce((total, ch) => total + ch.charCodeAt(0), 0);
  return (sum * 7) % 360;
}

function renderCover(level) {
  const hue = coverHue(level);
  el.art.style.background =
    "linear-gradient(135deg, hsl(" + hue + " 70% 28%), hsl(" + (hue + 60) + " 80% 12%))";

  if (level.thumb) {
    // If the image fails to load, fall back to the generated cover with the level name on it.
    el.art.innerHTML = '<img alt="" draggable="false" src="' + escapeHtml(level.thumb) + '">';
    el.art.querySelector("img").addEventListener("error", () => {
      el.art.innerHTML = "<b>" + escapeHtml(level.name) + "</b>";
    });
  } else {
    el.art.innerHTML = "<b>" + escapeHtml(level.name) + "</b>";
  }
}

function renderDetails(level, tier) {
  const [tierName, , tierLabel] = tier;
  const rows = [
    ["Verifier", level.verifier],
    ["Published by", level.publisher],
    ["Created by", level.creator],
    ["Level ID", level.id],
    ["Difficulty", level.difficulty],
    ["Requirement", level.requirement],
    ["Original", level.original],
    ["Score value", level.score],
    ["Completions", level.completions],
    ["Enjoyment", level.enjoyment],
    ["Tier", capitalize(tierName) + ", " + tierLabel.toLowerCase()],
    ["Tags", level.tags]
  ].filter(row => row[1]);

  el.rows.innerHTML = rows
    .map(([label, value]) => "<div><dt>" + label + "</dt><dd>" + escapeHtml(value) + "</dd></div>")
    .join("");

  el.desc.textContent = level.desc || "";
  el.desc.hidden = !level.desc;
  el.video.hidden = !level.video;
  if (level.video) el.video.href = level.video;
}

function showLevel(index) {
  const level = LEVELS[index];
  const tier = tierFor(level.rank);
  const tierName = tier[0];

  el.card.style.setProperty("--rarity", TIER_COLOR[tierName]);
  el.card.classList.toggle("apex", tierName === "apex");

  byId("cardRank").textContent = "#" + level.rank;
  byId("cardTier").textContent = capitalize(tierName);
  byId("cardName").textContent = level.name;
  byId("cardVerifier").textContent = "Verified by " + level.verifier;
  byId("cardPublisher").textContent = "Published by " + level.publisher;

  byId("title").textContent = "#" + level.rank + " " + level.name;
  const chip = byId("tierChip");
  chip.textContent = capitalize(tierName);
  chip.style.setProperty("--rarity", TIER_COLOR[tierName]);

  renderCover(level);
  renderDetails(level, tier);
}

/* ---------- controls ---------- */

LEVELS.forEach((level, i) => {
  el.pick.add(new Option("#" + level.rank + " " + level.name, i));
});
el.pick.addEventListener("change", e => showLevel(Number(e.target.value)));

let foilOn = true;
function setFoil(on) {
  foilOn = on;
  el.card.classList.toggle("flat", !on);
  el.foilBtn.setAttribute("aria-pressed", on);
}
el.foilBtn.addEventListener("click", () => setFoil(!foilOn));

/* ---------- motion ---------- */

// rotX/rotY are the card's own rotation; tiltX/tiltY is the small extra lean that follows the cursor.
const motion = {
  rotX: -8, rotY: -25,
  velX: 0, velY: 0,
  tiltX: 0, tiltY: 0,
  tiltTargetX: 0, tiltTargetY: 0,
  snapX: null, snapY: null,   // when set, ease toward this angle (Flip / Reset)
  autoSpin: true,
  dragging: false,
  lastX: 0, lastY: 0
};

const prefersReducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (prefersReducedMotion) motion.autoSpin = false;
el.spinBtn.setAttribute("aria-pressed", motion.autoSpin);

el.spinBtn.addEventListener("click", () => {
  motion.autoSpin = !motion.autoSpin;
  el.spinBtn.setAttribute("aria-pressed", motion.autoSpin);
});

function clearInertia() { motion.velX = motion.velY = 0; }

byId("flipBtn").addEventListener("click", () => {
  motion.snapY = (Math.round(motion.rotY / 180) + 1) * 180;
  motion.snapX = Math.round(motion.rotX / 360) * 360;
  clearInertia();
});

byId("resetBtn").addEventListener("click", () => {
  motion.snapY = Math.round(motion.rotY / 360) * 360;
  motion.snapX = Math.round(motion.rotX / 360) * 360;
  motion.tiltTargetX = motion.tiltTargetY = 0;
  clearInertia();
});

el.stage.addEventListener("dragstart", e => e.preventDefault());

el.stage.addEventListener("pointerdown", e => {
  motion.dragging = true;
  motion.snapX = motion.snapY = null;
  motion.lastX = e.clientX;
  motion.lastY = e.clientY;
  el.stage.classList.add("dragging");
  el.stage.setPointerCapture(e.pointerId);
});

el.stage.addEventListener("pointermove", e => {
  if (motion.dragging) {
    const dx = e.clientX - motion.lastX;
    const dy = e.clientY - motion.lastY;
    motion.lastX = e.clientX;
    motion.lastY = e.clientY;
    motion.rotY += dx * 0.6;
    motion.rotX -= dy * 0.6;
    motion.velY = dx * 0.6;
    motion.velX = -dy * 0.6;
  } else {
    const box = el.stage.getBoundingClientRect();
    motion.tiltTargetX = ((e.clientX - box.left) / box.width - 0.5) * 16;
    motion.tiltTargetY = -((e.clientY - box.top) / box.height - 0.5) * 16;
  }
});

function endDrag() {
  motion.dragging = false;
  el.stage.classList.remove("dragging");
}
el.stage.addEventListener("pointerup", endDrag);
el.stage.addEventListener("pointercancel", endDrag);
el.stage.addEventListener("pointerleave", () => {
  if (!motion.dragging) motion.tiltTargetX = motion.tiltTargetY = 0;
});

function step() {
  const m = motion;

  if (!m.dragging) {
    const snapping = m.snapX !== null || m.snapY !== null;

    if (m.snapY !== null) {
      m.rotY += (m.snapY - m.rotY) * 0.12;
      if (Math.abs(m.snapY - m.rotY) < 0.1) { m.rotY = m.snapY; m.snapY = null; }
    }
    if (m.snapX !== null) {
      m.rotX += (m.snapX - m.rotX) * 0.12;
      if (Math.abs(m.snapX - m.rotX) < 0.1) { m.rotX = m.snapX; m.snapX = null; }
    }

    if (!snapping) {
      // coast after a throw, then hand over to the slow auto-spin
      m.rotY += m.velY;
      m.rotX += m.velX;
      m.velY *= 0.94;
      m.velX *= 0.94;

      const coasting = Math.abs(m.velY) >= 0.3 || Math.abs(m.velX) >= 0.3;
      if (m.autoSpin && !coasting) {
        m.rotY += 0.6;
        m.rotX += (Math.round(m.rotX / 360) * 360 - m.rotX) * 0.04; // level the card back out
      }
    }
  }

  m.tiltX += (m.tiltTargetX - m.tiltX) * 0.1;
  m.tiltY += (m.tiltTargetY - m.tiltY) * 0.1;

  const yaw = m.rotY + m.tiltX;
  const pitch = m.rotX + m.tiltY;
  const sinYaw = Math.sin(yaw * Math.PI / 180);
  const sinPitch = Math.sin(pitch * Math.PI / 180);

  const style = el.card.style;
  style.transform = "rotateX(" + pitch + "deg) rotateY(" + yaw + "deg)";
  style.setProperty("--bx", (50 + sinYaw * 50) + "%");
  style.setProperty("--by", (50 - sinPitch * 50) + "%");
  style.setProperty("--gx", (50 + sinYaw * 60) + "%");
  style.setProperty("--gy", (50 - sinPitch * 60) + "%");
  style.setProperty("--hi", Math.min(1, 0.35 + Math.abs(sinYaw) * 0.45 + Math.abs(sinPitch) * 0.45));

  requestAnimationFrame(step);
}

renderBack();
showLevel(0);
setFoil(true);
step();
</script>
</body>
</html>
