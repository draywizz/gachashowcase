<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EVODL card showcase</title>
<!--
  Standalone: no libraries, no network. To use real levels, edit the LEVELS array below.
  thumb = image URL for the art area (optional; a generated cover is used if empty/broken).
  rarity = common | uncommon | rare | epic | legendary | mythic
-->
<style>
:root{--bg:#0b0b10;--panel:#14141b;--line:#262633;--text:#eef0f5;--muted:#9aa0b3;--rar:#a855f7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text);
 background:radial-gradient(900px 500px at 15% 0%,#241430,transparent),var(--bg);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
.wrap{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;align-items:center;width:100%;max-width:960px;
 background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px}
.left{display:flex;flex-direction:column;align-items:center;gap:14px}
.stage{width:310px;height:440px;perspective:1100px;display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none}
.stage.drag{cursor:grabbing}
.card{position:relative;width:260px;height:372px;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;border-radius:16px;overflow:hidden;isolation:isolate;backface-visibility:hidden;-webkit-backface-visibility:hidden;
 border:3px solid var(--rar);box-shadow:0 0 30px -8px var(--rar),0 20px 40px rgba(0,0,0,.55)}
.front{background:linear-gradient(160deg,#21212c,#101016);padding:12px;display:flex;flex-direction:column;gap:8px}
.back{transform:rotateY(180deg);background:radial-gradient(circle at 50% 46%,#1b4fa8 0%,#0c2257 45%,#050a1c 85%);border-color:#2f7bff;box-shadow:0 0 30px -8px #2f7bff,0 20px 40px rgba(0,0,0,.55);display:grid;place-items:center}
.back::after{content:"";position:absolute;inset:10px;border-radius:10px;border:1px solid #6fb2ff55;pointer-events:none}
.top{display:flex;justify-content:space-between;align-items:center}
.rank{font-size:24px;font-weight:800;letter-spacing:-.5px}
.chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--rar) 28%,#000);color:#fff;border:1px solid var(--rar)}
.art{position:relative;flex:1;border-radius:10px;overflow:hidden;border:1px solid #ffffff22;display:grid;place-items:center;text-align:center}
.card img{-webkit-user-drag:none;user-drag:none;user-select:none;pointer-events:none}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art b{position:relative;font-size:34px;line-height:.95;font-weight:900;letter-spacing:1px;text-transform:uppercase;text-shadow:0 2px 12px #000;padding:8px}
.name{font-weight:800;font-size:17px;line-height:1.15}
.sub{font-size:11.5px;color:var(--muted);margin-top:-6px}
.badge{align-self:flex-start;font-size:11px;font-weight:800;padding:2px 9px;border-radius:6px;color:#101016;background:linear-gradient(90deg,#4ade80,#60a5fa,#f0abfc)}
.holo,.glare{position:absolute;inset:0;pointer-events:none}
.holo{background:repeating-linear-gradient(115deg,#ff2d95 0%,#ffd32d 10%,#2dff8f 20%,#2dc4ff 30%,#8f2dff 40%,#ff2d95 50%);
 background-size:260% 260%;background-position:var(--bx) var(--by);mix-blend-mode:color-dodge;opacity:calc(var(--hi) * .6);filter:saturate(1.3)}
.glare{background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,255,255,.55),transparent 42%);mix-blend-mode:soft-light;opacity:var(--hi)}
.apex .face.front{border-color:transparent;box-shadow:0 0 34px -8px #8f2dff,0 20px 40px rgba(0,0,0,.55);
 background:linear-gradient(160deg,#21212c,#101016) padding-box,linear-gradient(135deg,#2dc4ff,#8f2dff,#ff2d95,#ffd32d,#2dff8f) border-box}
.chip.apexc{background:#e7c76a;border-color:#e7c76a;color:#2a2108}
.rainbow{background:linear-gradient(90deg,#2dc4ff,#8f2dff,#ff2d95,#ffd32d,#2dff8f);-webkit-background-clip:text;background-clip:text;color:transparent;border:0!important;padding:0!important}
.normal .holo,.normal .badge{display:none}
.logo{width:78%;height:auto;filter:drop-shadow(0 0 16px #3aa0ff99)}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
button,select,a.btn{text-decoration:none;display:inline-block;font:inherit;font-size:13px;color:var(--text);background:#1c1c26;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover,select:hover,a.btn:hover{border-color:#5b5b73}
button:focus-visible,select:focus-visible,a.btn:focus-visible{outline:2px solid #f5b301;outline-offset:2px}
button[aria-pressed=true]{border-color:#f5b301;color:#f5b301}
.hint{font-size:12px;color:var(--muted)}
.info{flex:1;min-width:280px;max-width:420px}
h1{margin:0 0 8px;font-size:26px;letter-spacing:-.3px}
.badges{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.badges .chip{font-size:12px}
dl{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;margin:0 0 14px}
dt{color:var(--muted)}dd{margin:0;font-weight:600}
p{color:#c4c8d6;margin:0 0 14px}
@media (prefers-reduced-motion:reduce){.stage{cursor:default}}
</style>
</head>

];
const COL={apex:"#8f2dff",common:"#9aa0a6",uncommon:"#3ecf6e",rare:"#3b82f6",epic:"#a855f7",legendary:"#f5b301",mythic:"#ef4444"};
const $=id=>document.getElementById(id), card=$("card"), stage=$("stage");
const cap=s=>s[0].toUpperCase()+s.slice(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
LEVELS.forEach((l,i)=>$("pick").add(new Option("#"+l.rank+" "+l.name,i)));
let holoOn=true;

function show(i){
  const l=LEVELS[i], t=tierOf(l.rank), r=t[0], c=COL[r], apex=r==="apex", hue=l.hue!==undefined?l.hue:apex?350:[...l.name].reduce((a,ch)=>a+ch.charCodeAt(0),0)*7%360;
  card.style.setProperty("--rar",c); card.classList.toggle("apex",apex);
  $("fRank").textContent="#"+l.rank; $("fRar").textContent=cap(r); $("fRar").classList.toggle("apexc",apex);
  $("fName").textContent=l.name; $("fVer").textContent="Verified by "+l.verifier; $("fPub").textContent="Published by "+l.publisher;
  const art=$("fArt");
  art.style.background="linear-gradient(135deg,hsl("+hue+" 70% 28%),hsl("+(hue+60)+" 80% 12%))";
  art.innerHTML=(l.thumb?'<img alt="" draggable="false" src="'+esc(l.thumb)+'" onerror="this.remove()">':"")+(l.thumb?"":"<b>"+esc(l.name)+"</b>");
  $("title").textContent="#"+l.rank+" "+l.name;
  const ic=$("iRar"); ic.textContent=cap(r); ic.classList.toggle("rainbow",apex); ic.style.borderColor=c;
  $("rows").innerHTML=[["Verifier",l.verifier],["Published by",l.publisher],["Created by",l.creator],["Level ID",l.id],["Difficulty",l.difficulty],["Requirement",l.requirement],["Original",l.original],["Score value",l.score],["Completions",l.completions],["Enjoyment",l.enjoyment],["Rank","#"+l.rank],["Tier",cap(r)+" ("+t[2].toLowerCase()+")"],["Tags",l.tags]].filter(r=>r[1])
    .map(r=>"<dt>"+r[0]+"</dt><dd>"+esc(r[1])+"</dd>").join("");
  $("desc").textContent=l.desc;$("desc").hidden=!l.desc;$("vid").hidden=!l.video;if(l.video)$("vid").href=l.video;
}
function holo(on){holoOn=on;card.classList.toggle("normal",!on);$("iHolo").hidden=!on;
  const b=$("holoBtn");b.setAttribute("aria-pressed",on);b.textContent="Holo: "+(on?"on":"off")}
$("pick").onchange=e=>show(+e.target.value);
$("holoBtn").onclick=()=>holo(!holoOn);

let rx=-8,ry=-25,vx=0,vy=0,tx=0,ty=0,ttx=0,tty=0,tgt={x:null,y:null},auto=true,drag=false,lx=0,ly=0;
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches; if(reduce){auto=false;$("auto").setAttribute("aria-pressed",false)}
$("auto").onclick=()=>{auto=!auto;$("auto").setAttribute("aria-pressed",auto)};
$("flip").onclick=()=>{tgt.y=(Math.round(ry/180)+1)*180;tgt.x=Math.round(rx/360)*360;vx=vy=0};
$("reset").onclick=()=>{tgt.y=Math.round(ry/360)*360;tgt.x=Math.round(rx/360)*360;vx=vy=0;ttx=tty=0};

stage.addEventListener("dragstart",e=>e.preventDefault());
stage.addEventListener("pointerdown",e=>{drag=true;tgt={x:null,y:null};lx=e.clientX;ly=e.clientY;stage.classList.add("drag");stage.setPointerCapture(e.pointerId)});
stage.addEventListener("pointermove",e=>{
  if(drag){const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;ry+=dx*.6;rx-=dy*.6;vy=dx*.6;vx=-dy*.6}
  else{const b=stage.getBoundingClientRect();ttx=((e.clientX-b.left)/b.width-.5)*16;tty=-((e.clientY-b.top)/b.height-.5)*16}
});
const up=()=>{drag=false;stage.classList.remove("drag")};
stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
stage.addEventListener("pointerleave",()=>{if(!drag){ttx=tty=0}});

function tick(){
  if(!drag){
    if(tgt.y!==null){ry+=(tgt.y-ry)*.12;if(Math.abs(tgt.y-ry)<.1){ry=tgt.y;tgt.y=null}}
    if(tgt.x!==null){rx+=(tgt.x-rx)*.12;if(Math.abs(tgt.x-rx)<.1){rx=tgt.x;tgt.x=null}}
    if(tgt.x===null&&tgt.y===null){
      ry+=vy;rx+=vx;vy*=.94;vx*=.94;
      if(auto&&Math.abs(vy)<.3&&Math.abs(vx)<.3){ry+=.6;rx+=(Math.round(rx/360)*360-rx)*.04}
    }
  }
  tx+=(ttx-tx)*.1;ty+=(tty-ty)*.1;
  const ey=ry+tx,ex=rx+ty,R=Math.PI/180,sx=Math.sin(ey*R),sy=Math.sin(ex*R);
  card.style.transform="rotateX("+ex+"deg) rotateY("+ey+"deg)";
  card.style.setProperty("--bx",(50+sx*50)+"%");card.style.setProperty("--by",(50-sy*50)+"%");
  card.style.setProperty("--gx",(50+sx*60)+"%");card.style.setProperty("--gy",(50-sy*60)+"%");
  card.style.setProperty("--hi",Math.min(1,.35+Math.abs(sx)*.45+Math.abs(sy)*.45));
  requestAnimationFrame(tick);
}
show(0);holo(true);tick();
</script>
